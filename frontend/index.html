<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Releases — AM Discovery</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fa2d48'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='18' fill='white'%3E%E2%99%AB%3C/text%3E%3C/svg%3E" />
  <meta name="description" content="Discover and track new Apple Music releases across HK, JP, MY, and TW storefronts." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="app-logo" id="sidebar-expand-btn" title="Expand sidebar">
        <span class="logo-icon">♫</span>
        <span class="logo-text">AM Discovery</span>
      </div>
    </div>

    <ul class="nav-list">
      <li><a href="#/" class="nav-link" id="nav-releases" data-page="releases">
        <span class="nav-icon">🎵</span><span class="nav-label">New Releases</span>
      </a></li>
      <li><a href="#/all" class="nav-link" id="nav-all" data-page="all">
        <span class="nav-icon">📀</span><span class="nav-label">All Albums</span>
      </a></li>
      <li><a href="#/watchlist" class="nav-link" id="nav-watchlist" data-page="watchlist">
        <span class="nav-icon">⭐</span><span class="nav-label">Artist Watchlist</span>
      </a></li>
      <li><a href="#/settings" class="nav-link" id="nav-settings" data-page="settings">
        <span class="nav-icon">⚙️</span><span class="nav-label">Settings</span>
      </a></li>
    </ul>

    <div class="sidebar-footer">
      <button class="sidebar-src-badge" id="sidebar-src-badge" title="Metadata source — click to expand"></button>
      <div class="meta-source-card" id="meta-source-card">
        <div class="meta-source-label">Metadata source</div>
        <div class="meta-source-chips" id="meta-source-chips"></div>
      </div>
      <div class="status-card" id="status-card">
        <div class="status-dot" id="status-dot"></div>
        <div class="status-info">
          <div class="status-label">Last updated</div>
          <div class="status-value" id="status-last-run">—</div>
        </div>
      </div>
      <button class="btn-refresh" id="btn-refresh" title="Refresh now">
        <span class="refresh-icon">↻</span><span class="btn-label"> Refresh</span>
      </button>
    </div>
  </nav>

  <div id="sidebar-backdrop"></div>

  <!-- Main content -->
  <main class="main-content" id="main-content">
    <!-- Pages injected by JS -->
  </main>

  <!-- Album detail modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
