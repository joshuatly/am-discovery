services:
  am-discovery:
    build: .
    container_name: am-discovery
    restart: unless-stopped
    environment:
      - AM_DB_PATH=/data/am_discovery.db
      - PORT=5000
    volumes:
      - am_data:/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/system/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  am_data:
