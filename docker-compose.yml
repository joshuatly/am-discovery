services:
  am-discovery:
    build: .
    container_name: am-discovery
    restart: unless-stopped
    environment:
      - AM_DB_PATH=/data/am_discovery.db
      - PORT=5000
    volumes:
      - am_data:/data
    expose:
      - "5000"
    networks:
      - proxy

volumes:
  am_data:

networks:
  proxy:
    external: true
